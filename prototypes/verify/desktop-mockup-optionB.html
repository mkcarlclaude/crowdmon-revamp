<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>crowdmon — swipe prototype v3</title>
<style>
:root{
  --mk:#e5326f;
  --done:oklch(72% 0.14 150);
  --failed:oklch(66% 0.18 25);
  --claimed:oklch(78% 0.14 85);
  --bg:#0d1117; --surface:#161b22; --text:#e6edf3; --muted:#8b949e; --rule:#21262d;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* v2 locked the whole app to the viewport (`height:100%` on a flex column),
   so there was nothing to scroll — and on a short screen the buttons went
   under the fold with no way to reach them. `min-height:100dvh` lets the
   document grow past the viewport when it needs to, `dvh` rather than `vh`
   because mobile browser chrome resizes the viewport as you scroll. The
   action bar is sticky rather than fixed so it stays in the thumb zone
   without being taken out of flow. */
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);font-family:var(--sans);
  overscroll-behavior-y:contain}

.bar{display:flex;justify-content:space-between;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  border-bottom:1px solid var(--rule)}
.mark{font-weight:600;letter-spacing:-.01em}
.demo{font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--rule);border-radius:999px;padding:3px 9px}

/* The whole stage is the swipe surface, not just the frame.

   A one-handed thumb pivots from a bottom corner: it lives in the lower
   third of the screen and travels in an arc. v3 listened on the image
   alone — a band in the vertical middle — so the gesture had to be made
   somewhere the thumb does not naturally go, and reaching up to a small
   target to make a large gesture is the worst combination available.
   Everything between the header and the buttons is live now; the frame is
   still the thing that moves, because it is the thing being decided. */
.stage{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  gap:16px;padding:18px;touch-action:pan-y;-webkit-user-select:none;user-select:none}

/* pan-y: vertical belongs to the page, horizontal belongs to us. With the
   document able to scroll again, this is now doing real work. */
.frame{position:relative;width:100%;border-radius:12px;overflow:hidden;
  border:1px solid var(--rule);background:#000;will-change:transform;pointer-events:none}
.frame img{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}

.bx{position:absolute;border:2px solid var(--claimed);opacity:.22;
  transition:opacity .18s,border-color .18s;pointer-events:none}
.bx.active{opacity:1;border-color:var(--mk);border-width:3px}
.bx.yes{opacity:.5;border-color:var(--done);pointer-events:auto}
.bx.no{opacity:.35;border-color:var(--failed);border-width:1px;border-style:dashed;pointer-events:auto}
.bx.no::after{content:"";position:absolute;inset:50% 0 auto 0;height:1px;background:var(--failed);opacity:.85}

/* The claim rides on the rectangle — the thing that changes when two
   proposals share identical geometry and the box itself cannot. */
.tag{position:absolute;display:flex;align-items:baseline;gap:7px;
  font-size:13px;font-weight:600;letter-spacing:-.01em;
  padding:4px 9px;border-radius:0 0 7px 0;color:#0d1117;background:var(--mk);
  white-space:nowrap;transform-origin:top left}
.tag .c{font-family:var(--mono);font-weight:400;font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.tag.pop{animation:pop .26s ease-out}
@keyframes pop{0%{transform:scale(.82);opacity:.3}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.wash{position:absolute;inset:0;pointer-events:none;opacity:0}
.wash.y{background:linear-gradient(270deg,color-mix(in oklch,var(--done) 45%,transparent),transparent 60%)}
.wash.n{background:linear-gradient(90deg,color-mix(in oklch,var(--failed) 45%,transparent),transparent 60%)}

.ticks{display:flex;gap:5px}
.tk{height:3px;flex:1;background:var(--rule);border-radius:2px}
.tk.d{background:var(--muted)}
.tk.a{background:var(--mk)}

.acts{position:sticky;bottom:0;display:flex;gap:10px;
  padding:12px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 72%,transparent);
  border-top:1px solid var(--rule)}
.btn{padding:17px 0;border-radius:12px;background:var(--surface);
  border:1px solid var(--rule);color:var(--text);font:600 16px var(--sans);letter-spacing:-.01em}
.btn:focus-visible{outline:2px solid var(--mk);outline-offset:2px}
.btn .g{font-family:var(--mono);opacity:.55;margin:0 6px;font-weight:400}
.btn.no{flex:1;border-color:color-mix(in oklch,var(--failed) 45%,var(--rule))}
.btn.yes{flex:1;border-color:color-mix(in oklch,var(--done) 45%,var(--rule))}
/* Undo is a peer of Yes and No, not a hidden gesture — v2 buried it in a
   banner and v1 buried it in a tap target nobody found. Narrower because it
   is the recovery action, not a choice; disabled rather than hidden so the
   row never reflows and the control stays discoverable before it is needed. */
.btn.undo{flex:0 0 84px;color:var(--muted);font-size:14px}
.btn.undo:disabled{opacity:.34}
.btn:not(:disabled):active{transform:translateY(1px)}

.done{text-align:center;padding:26px 18px;font-size:14px;color:var(--muted)}
.done b{color:var(--text);display:block;font-size:17px;margin-bottom:7px}

/* ── Desktop, option B ────────────────────────────────────────────────────
   Not "mobile but bigger". On a phone the constraint is thumb reach, so the
   swipe leads. On a desktop you have a keyboard, two hands and a wide screen,
   and verifying is a throughput task — so the keyboard leads and the layout
   uses the horizontal axis instead of fighting it.

   Below this breakpoint nothing changes: the mobile layout is untouched. */
@media (min-width:1024px){
  body{min-height:100dvh}
  .stage{
    flex-direction:row;align-items:center;justify-content:center;
    gap:40px;padding:40px;max-width:1200px;margin:0 auto;width:100%;
  }
  /* The cap that fixes the actual bug. Capped by WIDTH, never by max-height
     with object-contain: the box overlay is positioned in percentages of this
     container, so letterboxing would silently desync every rectangle from the
     image it describes. 16:9 then decides the height. */
  .framewrap{flex:1 1 auto;max-width:720px;min-width:0}
  .panel{flex:0 0 260px;display:flex;flex-direction:column;gap:18px}
  .panel .claim{display:block}
  .claimwho{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .claimconf{font-family:var(--mono);font-size:26px;color:var(--mk);
    font-variant-numeric:tabular-nums;margin-top:2px}
  .claimnote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
  /* Buttons leave the thumb zone and become an ordinary control group —
     stacked, full width, with the key bindings printed on them. The fastest
     desktop path was already implemented and completely invisible. */
  .acts{position:static;flex-direction:column;gap:9px;padding:0;
    border-top:0;background:none}
  .btn{width:100%;text-align:left;padding:15px 16px;display:flex;
    align-items:center;gap:13px}
  .btn.no,.btn.yes,.btn.undo{flex:none}
  .btn .k{font-family:var(--mono);font-size:12px;color:var(--muted);
    border:1px solid var(--rule);border-radius:5px;padding:2px 7px;min-width:30px;
    text-align:center}
  .btn .g{display:none}
  .ticks{margin-top:2px}
  .hintline{font-size:12px;color:var(--muted);line-height:1.5}
}
@media (max-width:1023px){
  .panel .claim{display:none}
  .btn .k{display:none}
  .hintline{display:none}
}
.claim{display:none}

@media (prefers-reduced-motion:reduce){ .frame,.bx,.tag{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<div class="bar">
  <span class="mark">crowdmon</span>
  <span class="demo">demo · nothing is saved</span>
</div>

<div class="stage">
  <div class="framewrap">
    <div class="frame" id="frame">
      <img id="img" alt="A sampled video frame with proposed detection boxes">
      <div class="wash y" id="wy"></div>
      <div class="wash n" id="wn"></div>
    </div>
  </div>

  <div class="panel">
    <div class="claim">
      <div class="claimwho" id="cwho">—</div>
      <div class="claimconf" id="cconf">0.00</div>
      <div class="claimnote">The detector's own confidence. It has never seen these
        characters, so most of these boxes are wrong.</div>
    </div>
    <div class="ticks" id="ticks"></div>
    <div class="acts">
      <button class="btn no" id="bno"><span class="k">←</span><span class="g">←</span>No</button>
      <button class="btn yes" id="byes"><span class="k">→</span>Yes<span class="g">→</span></button>
      <button class="btn undo" id="bundo" type="button" disabled><span class="k">⌫</span>Undo</button>
    </div>
    <div class="hintline">Arrow keys decide. You can still drag the frame.</div>
  </div>
</div>

const frame=document.getElementById("frame"),img=document.getElementById("img"),
 wy=document.getElementById("wy"),wn=document.getElementById("wn"),
 ticks=document.getElementById("ticks"),bundo=document.getElementById("bundo"),
 stage=document.querySelector(".stage"),acts=document.querySelector(".panel");

let fi=0,verdicts=[],els=[],tagEl=null,flushed=[],lastIdx=null,prevActive=-1;

function load(){
  const f=FRAMES[fi];
  img.src=f.img;
  [...frame.querySelectorAll(".bx,.tag")].forEach(e=>e.remove());
  els=[];tagEl=null;lastIdx=null;prevActive=-1;
  verdicts=f.boxes.map(()=>null);
  f.boxes.forEach((b,i)=>{
    const d=document.createElement("div");
    d.className="bx";
    d.style.left=(b.x/f.w*100)+"%";d.style.top=(b.y/f.h*100)+"%";
    d.style.width=(b.w/f.w*100)+"%";d.style.height=(b.h/f.h*100)+"%";
    d.addEventListener("click",()=>{ if(verdicts[i]!==null){verdicts[i]=null;lastIdx=null;paint();} });
    frame.appendChild(d);els.push(d);
  });
  tagEl=document.createElement("div");tagEl.className="tag";frame.appendChild(tagEl);
  paint();
}

const activeIdx=()=>verdicts.findIndex(v=>v===null);

function paint(){
  const a=activeIdx(),f=FRAMES[fi];
  els.forEach((e,i)=>{
    e.className="bx"+(verdicts[i]==="accept"?" yes":verdicts[i]==="reject"?" no":i===a?" active":"");
  });
  ticks.innerHTML=verdicts.map((v,i)=>'<span class="tk '+(v?"d":i===a?"a":"")+'"></span>').join("");
  bundo.disabled = lastIdx===null;

  if(a===-1){ tagEl.style.display="none"; commit(); return; }

  const b=f.boxes[a],box=els[a];
  tagEl.style.display="flex";
  tagEl.style.left=box.style.left;
  tagEl.style.top=box.style.top;
  tagEl.innerHTML=b.who+' <span class="c">'+b.c.toFixed(2)+'</span>';
  const cw=document.getElementById("cwho"),cc=document.getElementById("cconf");
  if(cw){cw.textContent=b.who;cc.textContent=b.c.toFixed(2);}
  if(a!==prevActive){ tagEl.classList.remove("pop"); void tagEl.offsetWidth; tagEl.classList.add("pop"); }
  prevActive=a;
}

function rule(v){ const a=activeIdx(); if(a===-1)return; verdicts[a]=v; lastIdx=a; paint(); }
function undoLast(){ if(lastIdx===null)return; verdicts[lastIdx]=null; lastIdx=null; paint(); }

function commit(){
  flushed.push(verdicts.filter(v=>v==="accept").length+"/"+verdicts.length);
  frame.style.transition="transform .22s,opacity .22s";
  frame.style.transform="translateY(-14px)";frame.style.opacity="0";
  setTimeout(()=>{
    fi++;
    if(fi>=FRAMES.length){finish();return;}
    frame.style.transition="none";frame.style.transform="translateY(14px)";
    load();
    requestAnimationFrame(()=>{frame.style.transition="transform .22s,opacity .22s";
      frame.style.transform="";frame.style.opacity="1";});
  },220);
}

function finish(){
  stage.innerHTML='<div class="done"><b>That is the whole loop.</b>'+
    flushed.length+' frames submitted as '+flushed.length+' requests — '+flushed.join(", ")+
    ' accepted.<br><br>One request per frame, never one per swipe.</div>';
  acts.style.display="none";
}

const THRESH=72, ARC_BIAS=0.7;
let x0=null,y0=null,dx=0,locked=null;
stage.addEventListener("pointerdown",e=>{
  if(activeIdx()===-1)return;
  x0=e.clientX;y0=e.clientY;dx=0;locked=null;frame.style.transition="none";
});
stage.addEventListener("pointermove",e=>{
  if(x0===null)return;
  const ax=e.clientX-x0,ay=e.clientY-y0;
  if(locked===null){
    if(Math.abs(ax)<10&&Math.abs(ay)<10)return;
    /* Biased toward horizontal. A straight |dx|>|dy| test is a 45 degree
       cutoff, and a thumb arcing across the screen routinely runs 30-40
       degrees off horizontal — steeper than that and the swipe was being
       handed to the page as a scroll, so it silently did nothing. ARC_BIAS
       0.7 widens the swipe cone to about 55 degrees. Horizontal gets the
       benefit of the doubt on purpose: a missed swipe is a dead control,
       a missed scroll is a page that moves a moment later. */
    locked=Math.abs(ax)>Math.abs(ay)*ARC_BIAS?"x":"y";
    if(locked==="x")stage.setPointerCapture(e.pointerId);
  }
  if(locked!=="x")return;   /* vertical: hands the gesture back to the page */
  dx=ax;
  frame.style.transform="translateX("+dx+"px) rotate("+(dx/60)+"deg)";
  const t=Math.min(Math.abs(dx)/THRESH,1);
  wy.style.opacity=dx>0?t:0;wn.style.opacity=dx<0?t:0;
});
function release(){
  if(x0===null)return;
  frame.style.transition="transform .2s";
  if(locked==="x"&&Math.abs(dx)>=THRESH) rule(dx>0?"accept":"reject");
  frame.style.transform="";wy.style.opacity=0;wn.style.opacity=0;
  x0=null;y0=null;dx=0;locked=null;
}
stage.addEventListener("pointerup",release);
stage.addEventListener("pointercancel",release);
document.getElementById("byes").onclick=()=>rule("accept");
document.getElementById("bno").onclick=()=>rule("reject");
bundo.onclick=undoLast;
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")rule("accept");
  if(e.key==="ArrowLeft")rule("reject");
  if(e.key==="Backspace"){e.preventDefault();undoLast();}
});
load();
</script>
</body>
</html>
