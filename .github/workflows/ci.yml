name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filters exist so a Go-only change does not rebuild and redeploy the
  # SPA, and vice versa. Filtering happens in one job so both toolchain jobs
  # can depend on the result rather than each recomputing it.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'biome.json'
              - '.github/workflows/ci.yml'
            go:
              - 'worker/**'
              - '.github/workflows/ci.yml'
              # The Go types are generated from the spec, so a contract change
              # with no Go file touched still has to re-run generation. Without
              # this line the drift check would be skipped by exactly the
              # change it exists to catch.
              - 'apps/api/openapi.json'

  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          # go.sum does not exist until the worker takes its first dependency
          # in M4; go.mod is always present and is a valid cache key.
          cache-dependency-path: worker/go.mod

      # Before vet and build, so a stale contract fails on the honest reason
      # rather than as a compile error in whatever code used the old field.
      - name: Check generated types match the spec
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/types.gen.go \
            || { echo "::error::internal/api/types.gen.go is stale. Run 'cd worker && go generate ./...' and commit."; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # Branch protection needs one stable check to require. Without this, a
  # skipped path-filtered job leaves the required check permanently pending.
  ci:
    name: CI
    if: always()
    needs: [typescript, go]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo "all required jobs succeeded or were skipped"
