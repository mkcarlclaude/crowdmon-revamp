name: Publish detector image

# Builds and pushes the pre-labelling sidecar's container on merge to main
# (M11.2), the same delivery path publish-worker.yml already uses: the home
# box pulls from GHCR on crowdmon-update.timer, which runs `docker compose
# pull` across every service in deploy/homebox/docker-compose.yml — without
# this workflow, that pull would fail for the detector service the moment
# this branch merges, because ghcr.io/mkcarlclaude/crowdmon-detector would
# not exist yet.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/detector/**'
      - '.github/workflows/publish-detector.yml'
  workflow_dispatch:

concurrency:
  group: publish-detector
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/crowdmon-detector
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: deploy/detector
          # Single-platform, the same reasoning publish-worker.yml gives:
          # the home box is the only consumer and it is x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max caches the export stage too — the expensive half, since
          # it downloads the checkpoint and runs a real ONNX export on every
          # otherwise-uncached build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
