name: Deploy API

# Deploys the Worker on merge to main. Requires the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets; until those exist this workflow
# will fail, which is the honest signal that the account is not provisioned yet.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      # The SPA is deployed by the same `wrangler deploy` as the Worker — one
      # Worker, one artefact. A web-only change must therefore trigger this
      # workflow, which is the cost accepted in exchange for a single origin.
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before the migration step, so a build failure costs nothing. Belt and
      # braces rather than load-bearing: `apps/api/package.json`'s `deploy`
      # script now builds web itself, so a missing or stale `apps/web/dist`
      # can't reach `wrangler deploy` from this workflow even if this step
      # were removed. It stays because a build failure caught here, before
      # migrations run, is cheaper than one caught inside the deploy step.
      - name: Build web
        run: pnpm --filter @crowdmon/web run build

      # Before the deploy, not after. Code that expects a column must never
      # reach production ahead of the column existing — the reverse ordering
      # fails every request in the window between the two steps.
      #
      # This makes migrations additive-only in practice: a destructive one that
      # lands here breaks the still-running previous version immediately, and
      # D1 has no rollback.
      - name: Apply D1 migrations
        run: pnpm --filter @crowdmon/api run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `run` is not optional here. Without it pnpm resolves `deploy` to its own
      # builtin `pnpm deploy` command rather than the package script, and fails
      # with ERR_PNPM_INVALID_DEPLOY_TARGET.
      - name: Deploy
        run: pnpm --filter @crowdmon/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify health endpoint
        run: |
          url="${{ vars.API_BASE_URL }}"
          if [ -z "$url" ]; then
            echo "API_BASE_URL is not set on the production environment."
            echo "It must be an environment *variable*, not a secret — a secret"
            echo "is unreadable from the vars context and would be masked here."
            exit 1
          fi
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "$url/health") && break
            echo "attempt $i failed, retrying in $((i * 2))s"
            sleep $((i * 2))
          done
          echo "health endpoint returned: $body"
          # Status alone stopped being evidence when the Worker started serving
          # static assets: `not_found_handling = "single-page-application"`
          # answers unmatched paths with index.html and a 200, so a
          # misconfigured `run_worker_first` would pass a status-only check
          # while the API was unreachable.
          case "$body" in
            *'"service":"crowdmon-api"'*) echo "API is answering /health" ;;
            *) echo "::error::/health did not return the API's JSON body"; exit 1 ;;
          esac
