<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>crowdmon — teaching a computer to see a video game</title>
    <!--
      `description` is a different tag from `og:description` below and is read
      by a different consumer: search engines use this one for the snippet,
      link-preview crawlers use the Open Graph one. Having only the OG tag left
      Google to invent a snippet from rendered content, which on an SPA means
      whatever survives its JavaScript pass.

      There is deliberately no canonical link element here. One shell serves every
      route (M5.1), so a canonical in this file would apply to `/demo` as well
      and declare it a duplicate of `/` — actively worse than having none. With
      two indexable URLs and no duplicate content, a per-route injected
      canonical would buy nothing for the complexity.
    -->
    <meta
      name="description"
      content="A detector's real guesses on real game footage, and the human verdicts that turn them into a labelled dataset. Built and run by one person on a home server."
    />
    <!--
      The v2 public surface is the landing page at `/` plus an OG card
      (CONTEXT.md §Q11, M20 plan §A4). These tags live in the static shell
      rather than being injected by React because the real distribution
      channel is a link pasted into Discord or Reddit — crawlers for those
      previews do not execute JavaScript, so anything client-rendered would
      simply not exist yet when the card is built. `og:image` points at a
      real frame from the dataset (the same one the hero uses), not a
      generated card, for the same "show the real thing" reason the hero
      itself does not fake a confident detection.
    -->
    <meta property="og:title" content="crowdmon — teaching a computer to see a video game" />
    <meta property="og:description" content="A real frame, a detector's real (and often wrong) guess, and the human verdict that turns it into a label. Built and run by one person on a home server." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crowdmon.mkcarl.com/" />
    <meta property="og:image" content="https://crowdmon.mkcarl.com/og-image.jpg" />
    <!--
      No blanket `noindex` here anymore (M20 plan §A4) — `/` is meant to be
      found. `/verify` and `/admin` still need it: `/verify` for CONTEXT.md
      §Q25's frame-bytes reasons, `/admin` because it was never meant to be
      crawled either, and neither reason has anything to do with `/`. Since
      one shell serves every route, the tag can no longer live here at all.

      The real control for those two is `public/_headers`
      (`X-Robots-Tag: noindex`, evaluated at the HTTP layer for every
      crawler, JS or not) — `src/hooks/use-noindex.ts` only adds a matching
      <meta> tag after React mounts, which is defense in depth for
      JS-executing crawlers, not the primary control. See `_headers`' own
      comment for what is and is not confirmed about how it applies under
      this app's SPA fallback routing.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
