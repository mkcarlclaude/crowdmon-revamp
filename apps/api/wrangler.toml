name = "crowdmon-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The Worker is reachable at crowdmon.mkcarl.com and nowhere else (M5.1).
# api.crowdmon.mkcarl.com was retired on 2026-08-03 once the Go worker had been
# repointed off it; the migration and what it taught are recorded in
# infra/README.md "Migrating to a single hostname (M5)".
#
# workers_dev is on by default, and the *.workers.dev hostname is not covered
# by any Access application — Access binds to a route on a zone, and
# workers.dev is not one. Everything under /api/admin was therefore protected
# there by the Worker's own JWT verification alone: correct, verified, and one
# layer where the design calls for two. Nothing needs the hostname now that the
# Go worker points at a custom domain (M4.3), so it is closed.
#
# Consequence, and the reason this is not free: the deploy workflow's health
# check reads the API_BASE_URL repository *variable*, which must name the
# custom domain. Flipping this back to true without repointing that variable
# leaves a deploy verifying a hostname that no longer answers.
workers_dev = false

# Version preview URLs are also on *.workers.dev, and are governed by their own
# setting rather than by workers_dev. Left at its default, adding static assets
# would have republished /api/admin/* on an ungated hostname — the M4.6 hole,
# reopened by a setting M4.6 never touched.
preview_urls = false

# Everything in this table is a plain var, readable by anyone who can read this
# repo. Secrets are set out-of-band and never appear here:
#
#   wrangler secret put CF_ACCESS_CLIENT_ID
#   wrangler secret put CF_ACCESS_CLIENT_SECRET
#   wrangler secret put ADMIN_EMAILS          # comma-separated
#
# Keep [vars] above the [[d1_databases]] and [[r2_buckets]] tables, and add new
# vars *here* rather than at the end of the file. TOML assigns a bare key to
# the most recent table header, so a var appended below lands inside the R2
# binding instead. wrangler accepts that silently and the Worker deploys
# without the var — which, for ACCESS_AUD, meant every admin request answering
# 503 in production.
[vars]
ENVIRONMENT = "production"

# Fronts the home collector's OTLP HTTP receiver. A var rather than a secret:
# the hostname is public knowledge, and that is acceptable only because Access
# gates it (CONTEXT.md §9).
OTLP_ENDPOINT = "https://otlp.mkcarl.com/v1/traces"

# Cloudflare Access on /api/admin/* (M3.5). Both are needed to *verify* an
# assertion and neither is enough to mint one: the team domain appears in every
# Access login URL, and the aud tag identifies an application rather than
# authorising anything.
#
# ACCESS_AUD comes from `terraform -chdir=infra output access_aud`. It is
# regenerated if the Access application is destroyed and recreated, and a stale
# value fails every admin request closed.
ACCESS_TEAM_DOMAIN = "https://mkcarl.cloudflareaccess.com"
ACCESS_AUD = "c2c479badd245242deee8f7b8c459af12850ac6bd0815f54ac3fa01f47f7403f"

# The reaper's thresholds (M6.2). Vars rather than constants because they are
# the two numbers an operator would want to change without a code review, and
# `src/reaper.ts` throws on a malformed one rather than defaulting.
#
# Four missed 30s heartbeats. Not tuned against the cron period: the cron
# decides how often staleness is noticed (0-5 minutes either way), this decides
# what staleness means. Tighter would start reaping workers that merely hit a
# transient API error — `runner.go` deliberately keeps beating through those
# rather than dropping a job it still holds.
LEASE_STALE_SECONDS = 120

# Three claims, then the job is retired as terminally failed. `attempts` is
# incremented on the claim rather than on a failure, so a worker that dies
# without reporting still spends one — which is the point. Without a ceiling a
# poison job (deleted video, geo-blocked, malformed) is claimed, crashes the
# worker, is reaped, and is claimed again forever.
MAX_ATTEMPTS = 3

# Presigned frame serving for a labelling session (M13.4, CONTEXT.md §Q25).
#
# Commented out deliberately, and this is the whole switch: with it set — plus
# the two secrets below — `/api/admin/labelling/batch` returns short-lived
# presigned URLs and the browser fetches frames straight from R2. Without it,
# the same endpoint returns this Worker's own Access-gated /api/admin/image
# path and answers `url_mode: "proxy"`. Both modes keep the bucket private and
# nothing enumerable; what differs is who moves the bytes.
#
# It is commented rather than filled in because the value embeds the account id
# and, more to the point, is useless without an R2 S3 access key — which only a
# human at the Cloudflare dashboard can mint, the same gate M8's bucket-scoped
# worker token sat behind. Uncomment and paste the endpoint once the key
# exists:
#
#   FRAMES_S3_BASE_URL = "https://<account-id>.r2.cloudflarestorage.com/crowdmon-frames"
#
#   wrangler secret put R2_ACCESS_KEY_ID
#   wrangler secret put R2_SECRET_ACCESS_KEY
#
# Setting only one half leaves the Worker in proxy mode on purpose
# (`src/frame-urls.ts`): signing with a missing secret produces URLs that look
# right and are rejected by R2, which surfaces as broken images rather than as
# anything an operator could read.

# D1 and R2 are provisioned by Terraform (M1.3). The IDs below come from
# `terraform -chdir=infra output`; wrangler binds to them, it does not create
# them. If these ever disagree with Terraform, Terraform is the source of truth.
#
# database_id is server-assigned and NOT stable: `terraform destroy` followed by
# `terraform apply` mints a new UUID, verified in M1.3. The bucket name is the
# bucket's identity and survives. After any destroy/re-apply, re-paste from
# `terraform -chdir=infra output d1_database_id` or deploys bind to a database
# that no longer exists.

[[d1_databases]]
binding = "DB"
database_name = "crowdmon"
database_id = "93c06c0b-10d8-4f4f-a3a6-c7a0a59c0e42"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FRAMES"
bucket_name = "crowdmon-frames"

# The SPA (M5.1). Served by this Worker rather than by Pages: one origin means
# the Access cookie, the Access application and the API cannot disagree, and it
# keeps M5.4's documented expiry symptom (a 302 followed to an HTML 200) intact
# instead of turning it into a CORS failure.
#
# `directory` is built by `pnpm --filter @crowdmon/web run build` and is
# gitignored. A *missing* directory is not the hazard — wrangler 4.118.0 hard-
# errors on that. A stale or empty one is: wrangler reads whatever is there,
# logs "Read 0 files from the assets directory" for an empty one, and exits 0
# either way, publishing yesterday's bundle (or none) with nothing to say so.
# `apps/api/package.json`'s `deploy` script runs the build first for exactly
# this reason — do not call `wrangler deploy` directly on a machine whose
# `dist` might be stale.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

# Without this list, `single-page-application` answers every non-asset path with
# index.html and the Worker never runs. /health and /openapi.json are Hono
# routes outside /api/, so leaving them out makes the deploy workflow's health
# check curl the SPA shell and report success over a dead API.
run_worker_first = [ "/api/*", "/health", "/openapi.json" ]
