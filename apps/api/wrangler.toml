name = "crowdmon-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Fronts the home collector's OTLP HTTP receiver. A var rather than a secret:
# the hostname is public knowledge, and that is acceptable only because Access
# gates it (CONTEXT.md §9). The credentials that get past Access are secrets and
# are set out-of-band:
#
#   wrangler secret put CF_ACCESS_CLIENT_ID
#   wrangler secret put CF_ACCESS_CLIENT_SECRET
OTLP_ENDPOINT = "https://otlp.mkcarl.com/v1/traces"

# D1 and R2 are provisioned by Terraform (M1.3). The IDs below come from
# `terraform -chdir=infra output`; wrangler binds to them, it does not create
# them. If these ever disagree with Terraform, Terraform is the source of truth.
#
# database_id is server-assigned and NOT stable: `terraform destroy` followed by
# `terraform apply` mints a new UUID, verified in M1.3. The bucket name is the
# bucket's identity and survives. After any destroy/re-apply, re-paste from
# `terraform -chdir=infra output d1_database_id` or deploys bind to a database
# that no longer exists.

[[d1_databases]]
binding = "DB"
database_name = "crowdmon"
database_id = "93c06c0b-10d8-4f4f-a3a6-c7a0a59c0e42"

[[r2_buckets]]
binding = "FRAMES"
bucket_name = "crowdmon-frames"
