# The worker on the home box.
#
# Its own compose project rather than a service inside the monitoring stack's
# file: that stack is shared with unrelated projects, has no git checkout on
# the box (CONTEXT.md §9.7), and taking it down to restart this worker would
# be an absurd blast radius. Ownership follows the blast radius here exactly
# as it did for the tunnel in §6.
#
# Deployed to /home/carl/crowdmon. See README.md in this directory.

services:
  worker:
    # `latest` is what the update timer pulls. The running image's digest is
    # the honest answer to "what is deployed", and `docker compose images`
    # prints it.
    image: ghcr.io/mkcarlclaude/crowdmon-worker:latest
    container_name: crowdmon-worker

    # Not `always`: an operator who stops this deliberately should find it
    # still stopped after a reboot. `unless-stopped` restarts it on boot and
    # after a crash, and respects an explicit `docker stop`.
    restart: unless-stopped

    # Credentials and the API base URL. Not committed — see .env.example.
    env_file: .env

    # Source videos (M7.1). A named volume rather than the container's own
    # filesystem, because the chunk jobs a download enqueues read the file it
    # left behind: an update that recreated the container would throw away
    # videos whose chunks had not run, and every one of those chunks would then
    # report the affinity failure (M7.4) on a box that had downloaded the video
    # perfectly. The update timer recreates this container four times a day.
    #
    # The path must match CROWDMON_WORK_DIR — its default is this path, and the
    # two disagreeing is invisible until a restart.
    volumes:
      - source-videos:/home/worker/videos

    # No ports, no inbound anything. The worker only makes outbound calls: to
    # the API over the internet, to the collector through otlp.mkcarl.com —
    # traces, logs, and as of M8.2 frame-extraction metrics, all the same host
    # and the same gate — and since M8.3 to R2's S3-compatible endpoint
    # directly, because frame bytes never transit the Workers API (CONTEXT.md
    # §2). It joins no network beyond the default one this project creates, and
    # in particular not the monitoring stack's — nothing needs to reach it.

    # R2, dedup and metrics settings flow through env_file above with
    # everything else — no separate `environment:` list here, and none should
    # be added for them. A list that named some keys and left the rest to
    # env_file would make it look like the named ones are special; they aren't,
    # and the right place to see what is configured is .env.example.

    # Stdout is the log, and the box's journal is where it lands. Capped so a
    # worker in a failure loop cannot fill the disk the video work will need.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Room for one video and its frames, with the rest of the box left alone.
    # Unchanged in M7: phase one streams a download to disk and runs ffprobe,
    # neither of which holds a video in memory. The number to revisit is M8's,
    # when extraction decodes frames.
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  # Survives `docker compose up` recreating the container, which is the whole
  # reason it is not a bind mount into the host's home directory: a volume is
  # owned by Docker and needs no uid juggling to be writable by the image's
  # unprivileged `worker` user.
  source-videos:
